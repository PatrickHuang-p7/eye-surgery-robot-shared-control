controller_manager:
  ros__parameters:
    update_rate: 50 # 50Hz 控制更新频率 (与你的硬件接口 read/write 频率匹配)

# 1. 关节状态广播器：负责将硬件接口的读取结果发布到 /joint_states 话题
joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

# 2. 关节轨迹控制器：负责接收来自 MoveIt 2 的高层指令
joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
    command_interfaces:
      - position # 我们在 URDF 中只导出了 position 命令
    state_interfaces:
      - position
      - velocity


    allow_partial_joints_goal: true
    allow_integration_in_goal_trajectory: true