controller_manager:
  ros__parameters:
    update_rate: 30 # 控制器更新频率 30Hz

    # 1. 关节轨迹控制器：用于接收 IK 节点的复杂运动指令
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # 2. 关节状态发布器：用于发布 /joint_states 话题
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
    interface_name: position
    command_interface:
      - position
    state_interfaces:
      - position
      - velocity
      - effort
    # PID 参数 (为 Gazebo 仿真设置合理值)
    state_tolerance: 0.01
    goal_tolerance:
      joint_1: 0.005
      joint_2: 0.005
      joint_3: 0.005
      joint_4: 0.005
    stop_tolerance: 0.01
    allow_partial_joints_goal: false